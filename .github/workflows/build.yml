          cat <<-'EOF' > jbl/src/com/luan/jbllauncher/MainActivity.java
          package com.luan.jbllauncher;
          import android.app.Activity;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Color;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.media.AudioManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.text.TextUtils;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.widget.BaseAdapter;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.GridView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;

          public class MainActivity extends Activity {
              private GridView appGrid;
              private LinearLayout favRow;
              private FrameLayout screensaverOverlay;
              private SeekBar seekVolume, seekBrightness;
              private AudioManager audioManager;
              private List<AppItem> favList = new ArrayList<>();
              private List<AppItem> otherList = new ArrayList<>();
              private AppAdapter adapter;
              private static final long SCREENSAVER_DELAY = 2 * 60 * 1000L;
              private final Handler idleHandler = new Handler(Looper.getMainLooper());
              private final Runnable screensaverRunnable = new Runnable() {
                  @Override public void run() { enterScreensaver(); }
              };
              private static final String[] FAV_KEYWORDS = {
                  "youtube", "revanced", "rimusic", "ymusic", "smarttube", "spotify", "music", "vanced", "chrome"
              };
              private static final String[] HIDDEN_PACKAGES = {
                  "com.android.traceur", "com.android.PrintSpooler", "com.android.keychain"
              };
              private static class AppItem {
                  String label;
                  String packageName;
                  Drawable icon;
              }
              private final BroadcastReceiver packageReceiver = new BroadcastReceiver() {
                  @Override public void onReceive(Context context, Intent intent) { loadApps(); }
              };
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  appGrid = findViewById(R.id.appGrid);
                  favRow = findViewById(R.id.favRow);
                  screensaverOverlay = findViewById(R.id.screensaverOverlay);
                  seekVolume = findViewById(R.id.seekVolume);
                  seekBrightness = findViewById(R.id.seekBrightness);
                  Button btnSettings = findViewById(R.id.btnSettings);
                  Button btnSleepNow = findViewById(R.id.btnSleepNow);
                  btnSettings.setOnClickListener(v -> {
                      try { startActivity(new Intent(Settings.ACTION_SETTINGS)); } catch (Exception ignored) {}
                  });
                  btnSleepNow.setOnClickListener(v -> enterScreensaver());
                  screensaverOverlay.setOnClickListener(v -> exitScreensaver());
                  setupSliders();
                  adapter = new AppAdapter();
                  appGrid.setAdapter(adapter);
                  appGrid.setOnItemClickListener((parent, view, position, id) -> openApp(otherList.get(position)));
                  appGrid.setOnItemLongClickListener((parent, view, position, id) -> {
                      openAppInfo(otherList.get(position));
                      return true;
                  });
                  IntentFilter filter = new IntentFilter();
                  filter.addAction(Intent.ACTION_PACKAGE_ADDED);
                  filter.addAction(Intent.ACTION_PACKAGE_REMOVED);
                  filter.addDataScheme("package");
                  registerReceiver(packageReceiver, filter);
                  loadApps();
                  resetIdleTimer();
              }
              private void setupSliders() {
                  audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                  int maxVol = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
                  int curVol = audioManager.getStreamVolume(AudioManager.STREAM_MUSIC);
                  seekVolume.setMax(maxVol);
                  seekVolume.setProgress(curVol);
                  seekVolume.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar seekBar, int progress, boolean fromUser) {
                          if (fromUser) audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, progress, 0);
                      }
                      @Override public void onStartTrackingTouch(SeekBar seekBar) {}
                      @Override public void onStopTrackingTouch(SeekBar seekBar) {}
                  });
                  int curBrightness = Settings.System.getInt(getContentResolver(), Settings.System.SCREEN_BRIGHTNESS, 150);
                  seekBrightness.setProgress(curBrightness);
                  seekBrightness.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar seekBar, int progress, boolean fromUser) {
                          if (!fromUser) return;
                          int safeBrightness = Math.max(10, progress);
                          WindowManager.LayoutParams lp = getWindow().getAttributes();
                          lp.screenBrightness = safeBrightness / 255f;
                          getWindow().setAttributes(lp);
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && Settings.System.canWrite(MainActivity.this)) {
                              Settings.System.putInt(getContentResolver(), Settings.System.SCREEN_BRIGHTNESS_MODE, Settings.System.SCREEN_BRIGHTNESS_MODE_MANUAL);
                              Settings.System.putInt(getContentResolver(), Settings.System.SCREEN_BRIGHTNESS, safeBrightness);
                          }
                      }
                      @Override public void onStartTrackingTouch(SeekBar seekBar) {}
                      @Override public void onStopTrackingTouch(SeekBar seekBar) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.System.canWrite(MainActivity.this)) {
                              Intent intent = new Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS);
                              intent.setData(Uri.parse("package:" + getPackageName()));
                              startActivity(intent);
                          }
                      }
                  });
              }
              @Override public boolean dispatchTouchEvent(MotionEvent ev) {
                  resetIdleTimer();
                  return super.dispatchTouchEvent(ev);
              }
              private void resetIdleTimer() {
                  idleHandler.removeCallbacks(screensaverRunnable);
                  idleHandler.postDelayed(screensaverRunnable, SCREENSAVER_DELAY);
              }
              private void enterScreensaver() {
                  screensaverOverlay.setVisibility(View.VISIBLE);
                  WindowManager.LayoutParams lp = getWindow().getAttributes();
                  lp.screenBrightness = 0.01f;
                  getWindow().setAttributes(lp);
              }
              private void exitScreensaver() {
                  screensaverOverlay.setVisibility(View.GONE);
                  WindowManager.LayoutParams lp = getWindow().getAttributes();
                  lp.screenBrightness = Math.max(10, seekBrightness.getProgress()) / 255f;
                  getWindow().setAttributes(lp);
                  resetIdleTimer();
              }
              @Override protected void onResume() {
                  super.onResume();
                  if (audioManager != null) seekVolume.setProgress(audioManager.getStreamVolume(AudioManager.STREAM_MUSIC));
                  resetIdleTimer();
              }
              @Override protected void onPause() {
                  super.onPause();
                  idleHandler.removeCallbacks(screensaverRunnable);
              }
              @Override protected void onDestroy() {
                  super.onDestroy();
                  unregisterReceiver(packageReceiver);
              }
              @Override public void onBackPressed() {
                  if (screensaverOverlay.getVisibility() == View.VISIBLE) exitScreensaver();
              }
              private void openApp(AppItem app) {
                  Intent launchIntent = getPackageManager().getLaunchIntentForPackage(app.packageName);
                  if (launchIntent != null) startActivity(launchIntent);
              }
              private void openAppInfo(AppItem app) {
                  Intent intent = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                  intent.setData(Uri.parse("package:" + app.packageName));
                  startActivity(intent);
              }
              private void loadApps() {
                  PackageManager pm = getPackageManager();
                  Intent mainIntent = new Intent(Intent.ACTION_MAIN, null);
                  mainIntent.addCategory(Intent.CATEGORY_LAUNCHER);
                  List<ResolveInfo> infos = pm.queryIntentActivities(mainIntent, 0);
                  favList.clear();
                  otherList.clear();
                  String myPkg = getPackageName();
                  for (ResolveInfo info : infos) {
                      String pkg = info.activityInfo.packageName;
                      if (pkg.equals(myPkg) || isHidden(pkg)) continue;
                      AppItem item = new AppItem();
                      item.label = info.loadLabel(pm).toString();
                      item.packageName = pkg;
                      item.icon = info.loadIcon(pm);
                      if (isFavorite(pkg, item.label) && favList.size() < 4) favList.add(item);
                      else otherList.add(item);
                  }
                  Comparator<AppItem> sortByName = Comparator.comparing(a -> a.label.toLowerCase());
                  Collections.sort(favList, sortByName);
                  Collections.sort(otherList, sortByName);
                  while (favList.size() < 4 && !otherList.isEmpty()) favList.add(otherList.remove(0));
                  renderFavRow();
                  adapter.notifyDataSetChanged();
              }
              private boolean isFavorite(String pkg, String label) {
                  String check = (pkg + " " + label).toLowerCase();
                  for (String kw : FAV_KEYWORDS) if (check.contains(kw)) return true;
                  return false;
              }
              private boolean isHidden(String pkg) {
                  for (String h : HIDDEN_PACKAGES) if (pkg.equalsIgnoreCase(h)) return true;
                  return false;
              }
              private void renderFavRow() {
                  favRow.removeAllViews();
                  for (int i = 0; i < favList.size(); i++) {
                      final AppItem item = favList.get(i);
                      LinearLayout card = createCardView(item, true);
                      LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f);
                      if (i < favList.size() - 1) params.rightMargin = 16;
                      card.setLayoutParams(params);
                      card.setOnClickListener(v -> openApp(item));
                      card.setOnLongClickListener(v -> { openAppInfo(item); return true; });
                      favRow.addView(card);
                  }
              }
              private LinearLayout createCardView(AppItem item, boolean isLarge) {
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setGravity(Gravity.CENTER);
                  int pad = isLarge ? 16 : 12;
                  card.setPadding(pad, pad, pad, pad);
                  GradientDrawable shape = new GradientDrawable();
                  shape.setShape(GradientDrawable.RECTANGLE);
                  shape.setCornerRadius(isLarge ? 22f : 16f);
                  shape.setColor(Color.parseColor(isLarge ? "#282A36" : "#1E1F23"));
                  if (isLarge) shape.setStroke(2, Color.parseColor("#44475A"));
                  card.setBackground(shape);
                  ImageView iconView = new ImageView(this);
                  int iconSize = isLarge ? 72 : 56;
                  iconView.setLayoutParams(new LinearLayout.LayoutParams(iconSize, iconSize));
                  iconView.setImageDrawable(item.icon);
                  TextView titleView = new TextView(this);
                  titleView.setText(item.label);
                  titleView.setTextColor(Color.WHITE);
                  titleView.setTextSize(isLarge ? 15f : 13f);
                  titleView.setGravity(Gravity.CENTER);
                  titleView.setSingleLine(true);
                  titleView.setEllipsize(TextUtils.TruncateAt.END);
                  LinearLayout.LayoutParams textParams = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  textParams.topMargin = 8;
                  titleView.setLayoutParams(textParams);
                  card.addView(iconView);
                  card.addView(titleView);
                  return card;
              }
              private class AppAdapter extends BaseAdapter {
                  @Override public int getCount() { return otherList.size(); }
                  @Override public Object getItem(int pos) { return otherList.get(pos); }
                  @Override public long getItemId(int pos) { return pos; }
                  @Override public View getView(int position, View convertView, ViewGroup parent) {
                      return createCardView(otherList.get(position), false);
                  }
              }
          }
          EOF

          $BUILD_TOOLS/aapt package -f -m -J jbl/src -M jbl/AndroidManifest.xml -S jbl/res -I $PLATFORM
          javac -source 1.8 -target 1.8 -d jbl/obj -cp $PLATFORM jbl/src/com/luan/jbllauncher/*.java
          $BUILD_TOOLS/d8 jbl/obj/com/luan/jbllauncher/*.class --lib $PLATFORM --output jbl/
          $BUILD_TOOLS/aapt package -f -M jbl/AndroidManifest.xml -S jbl/res -I $PLATFORM -F jbl/unsigned.apk
          (cd jbl && $BUILD_TOOLS/aapt add unsigned.apk classes.dex)
          $BUILD_TOOLS/zipalign -f 4 jbl/unsigned.apk jbl/aligned.apk
          $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out output_apks/JBL_TV_Launcher.apk jbl/aligned.apk

          cat <<-'EOF' > niagara/AndroidManifest.xml
