name: Build Optimized Launcher

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile Super Light Launcher
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          PLATFORM="$ANDROID_HOME/platforms/android-34/android.jar"

          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Luan, OU=Dev, O=Home, L=KonTum, S=KT, C=VN"

          mkdir -p output_apks
          mkdir -p app/src/com/luan/jbllauncher app/res/layout app/obj

          cat <<-'EOF' > app/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.luan.jbllauncher"
              android:versionCode="2"
              android:versionName="2.0">
              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="34" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <application
                  android:label="JBL Fast Home"
                  android:persistent="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="sensorLandscape"
                      android:launchMode="singleTask"
                      android:clearTaskOnLaunch="true"
                      android:stateNotNeeded="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat <<-'EOF' > app/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#0A0A0C"
              android:padding="20dp">
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:layout_marginBottom="16dp">
                  <TextClock
                      android:layout_width="0dp"
                      android:layout_weight="1"
                      android:layout_height="wrap_content"
                      android:format12Hour="HH:mm"
                      android:format24Hour="HH:mm"
                      android:textColor="#FFFFFF"
                      android:textSize="64sp"
                      android:fontFamily="sans-serif-light" />
                  <Button
                      android:id="@+id/btnSettings"
                      android:layout_width="110dp"
                      android:layout_height="44dp"
                      android:text="Cai dat"
                      android:textColor="#FFFFFF"
                      android:background="#1E1F26" />
              </LinearLayout>
              <GridView
                  android:id="@+id/appGrid"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:numColumns="5"
                  android:horizontalSpacing="12dp"
                  android:verticalSpacing="12dp"
                  android:stretchMode="columnWidth"
                  android:gravity="center"
                  android:scrollbars="none" />
          </LinearLayout>
          EOF

          cat <<-'EOF' > app/src/com/luan/jbllauncher/MainActivity.java
          package com.luan.jbllauncher;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Color;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.text.TextUtils;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.BaseAdapter;
          import android.widget.Button;
          import android.widget.GridView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;

          public class MainActivity extends Activity {
              private GridView appGrid;
              private List<AppItem> appList = new ArrayList<>();
              private AppAdapter adapter;
              private static class AppItem {
                  String label;
                  String packageName;
                  Drawable icon;
              }
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  appGrid = findViewById(R.id.appGrid);
                  Button btnSettings = findViewById(R.id.btnSettings);
                  btnSettings.setOnClickListener(v -> {
                      try { startActivity(new Intent(Settings.ACTION_SETTINGS)); } catch (Exception ignored) {}
                  });
                  adapter = new AppAdapter();
                  appGrid.setAdapter(adapter);
                  appGrid.setOnItemClickListener((parent, view, position, id) -> {
                      AppItem app = appList.get(position);
                      Intent intent = getPackageManager().getLaunchIntentForPackage(app.packageName);
                      if (intent != null) startActivity(intent);
                  });
                  loadApps();
              }
              @Override public void onBackPressed() {}
              private void loadApps() {
                  PackageManager pm = getPackageManager();
                  Intent intent = new Intent(Intent.ACTION_MAIN, null);
                  intent.addCategory(Intent.CATEGORY_LAUNCHER);
                  List<ResolveInfo> infos = pm.queryIntentActivities(intent, 0);
                  appList.clear();
                  String myPkg = getPackageName();
                  for (ResolveInfo info : infos) {
                      String pkg = info.activityInfo.packageName;
                      if (pkg.equals(myPkg)) continue;
                      AppItem item = new AppItem();
                      item.label = info.loadLabel(pm).toString();
                      item.packageName = pkg;
                      item.icon = info.loadIcon(pm);
                      appList.add(item);
                  }
                  Collections.sort(appList, Comparator.comparing(a -> a.label.toLowerCase()));
                  adapter.notifyDataSetChanged();
              }
              private class AppAdapter extends BaseAdapter {
                  @Override public int getCount() { return appList.size(); }
                  @Override public Object getItem(int pos) { return appList.get(pos); }
                  @Override public long getItemId(int pos) { return pos; }
                  @Override public View getView(int position, View convertView, ViewGroup parent) {
                      LinearLayout card = new LinearLayout(MainActivity.this);
                      card.setOrientation(LinearLayout.VERTICAL);
                      card.setGravity(Gravity.CENTER);
                      card.setPadding(12, 12, 12, 12);
                      GradientDrawable shape = new GradientDrawable();
                      shape.setShape(GradientDrawable.RECTANGLE);
                      shape.setCornerRadius(16f);
                      shape.setColor(Color.parseColor("#181920"));
                      card.setBackground(shape);
                      AppItem item = appList.get(position);
                      ImageView iconView = new ImageView(MainActivity.this);
                      iconView.setLayoutParams(new LinearLayout.LayoutParams(56, 56));
                      iconView.setImageDrawable(item.icon);
                      TextView titleView = new TextView(MainActivity.this);
                      titleView.setText(item.label);
                      titleView.setTextColor(Color.WHITE);
                      titleView.setTextSize(12f);
                      titleView.setGravity(Gravity.CENTER);
                      titleView.setSingleLine(true);
                      titleView.setEllipsize(TextUtils.TruncateAt.END);
                      LinearLayout.LayoutParams tp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                      tp.topMargin = 6;
                      titleView.setLayoutParams(tp);
                      card.addView(iconView);
                      card.addView(titleView);
                      return card;
                  }
              }
          }
          EOF

          $BUILD_TOOLS/aapt package -f -m -J app/src -M app/AndroidManifest.xml -S app/res -I $PLATFORM
          javac -source 1.8 -target 1.8 -d app/obj -cp $PLATFORM app/src/com/luan/jbllauncher/*.java
          $BUILD_TOOLS/d8 app/obj/com/luan/jbllauncher/*.class --lib $PLATFORM --output app/
          $BUILD_TOOLS/aapt package -f -M app/AndroidManifest.xml -S app/res -I $PLATFORM -F app/unsigned.apk
          (cd app && $BUILD_TOOLS/aapt add unsigned.apk classes.dex)
          $BUILD_TOOLS/zipalign -f 4 app/unsigned.apk app/aligned.apk
          $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out output_apks/JBL_Fast_Launcher.apk app/aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JBL_Fast_Launcher
          path: output_apks/*.apk
